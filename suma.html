<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Suma </h1>
    <script>
        let N1=Number(prompt("introduce el primer numero"));
        let N2=Number(prompt("introduce el segundo numero"));
        suma = N1 + N2;
        document.write("el valor en suma es:" + suma + "<br>"); 
        
        resta = N1 - N2;
        document.write("el valor en resta es:" + resta + "<br>");

        multiplicacion = N1 * N2;
        document.write("el valor en multiplicacion es:" + multiplicacion + "<br>");

        division= N1 / N2;
        document.write("el valor en divicion es:" + division );
    </script>
</body>
</html>
