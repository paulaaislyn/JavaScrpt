<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let edad=Number(prompt("Escribe tu edad"));

        if(edad>=18){
            document.write("Eres mayor de edad, puedes votar");
        }else{
            document.write("No eres mayor de edad");
            document.write("<br>");
            document.write("No puedes votar");
        }
    </script>
</body>
</html>
